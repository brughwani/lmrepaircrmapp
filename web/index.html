<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="LM Repair Service Centre CRM & Complaint Management System">

  <!-- PWA & Android Meta Tags -->
  <meta name="theme-color" content="#1976D2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="LM Repair CRM">

  <!-- iOS PWA Meta Tags & Icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LM CRM">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LM Repair CRM</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .pwa-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background-color: #f5f5f5;
      transition: opacity 0.3s ease-out;
    }
    .pwa-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .pwa-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #1976D2;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
    }
    .pwa-title {
      margin-top: 18px;
      font-size: 18px;
      font-weight: 600;
      color: #263238;
      letter-spacing: 0.3px;
    }
    .pwa-subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: #78909c;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="pwa-loader" class="pwa-loader">
    <div class="pwa-spinner"></div>
    <div class="pwa-title">LM Repair CRM</div>
    <div class="pwa-subtitle">Starting service centre app...</div>
  </div>

  <script>
    // Smoothly remove loader as soon as Flutter renders the first frame
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('pwa-loader');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function () {
          if (loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 300);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
